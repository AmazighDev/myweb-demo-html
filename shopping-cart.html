<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopEasy Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .cart-drawer {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 20rem;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 50;
    }
    .cart-drawer.open { transform: translateX(0); }

    .backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 40;
    }
    .backdrop.visible { opacity: 1; pointer-events: all; }

    .product-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }
    .product-card.show { opacity: 1; }
    .product-card:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Header -->
  <header class="flex items-center justify-between p-4 bg-gradient-to-r from-blue-600 to-indigo-700 shadow-lg text-white">
    <h1 class="text-2xl font-extrabold tracking-wide">ShopEasy</h1>
    <button id="cart-btn" class="flex items-center px-4 py-2 bg-white text-blue-600 font-semibold rounded-full shadow hover:bg-gray-200 transition">
      🛒 <span id="cart-count" class="ml-2">0</span>
    </button>
  </header>

  <!-- Search & Categories -->
  <div class="p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <input id="search" type="text" placeholder="Search products..." class="p-2 rounded-lg border w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <div id="categories" class="flex gap-2 flex-wrap"></div>
  </div>

  <!-- Product Grid -->
  <main id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-6"></main>

  <!-- Backdrop -->
  <div id="backdrop" class="backdrop"></div>

  <!-- Cart Drawer -->
  <div id="cart-drawer" class="cart-drawer bg-white shadow-lg p-5 rounded-l-2xl">
    <h2 class="text-xl font-bold mb-4">Your Cart</h2>
    <ul id="cart-items" class="space-y-3 max-h-[60vh] overflow-y-auto mb-4"></ul>
    <div class="border-t pt-3">
      <p class="flex justify-between font-semibold">Total: <span id="cart-total">$0</span></p>
      <button id="checkout-btn" class="mt-3 w-full bg-green-600 text-white py-2 rounded-lg font-medium hover:bg-green-700 transition">Checkout</button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkout-modal" class="fixed inset-0 hidden flex justify-center items-center z-30">
    <div id="checkout-backdrop" class="absolute inset-0 bg-black opacity-30"></div>
    <div class="relative bg-white p-6 rounded-2xl shadow-xl w-80">
      <h3 class="text-xl font-bold mb-4">Checkout</h3>
      <p class="mb-4">Total: <span id="checkout-total">$0</span></p>
      <button id="confirm-btn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Confirm Purchase</button>
    </div>
  </div>

  <script>
    const products = [
      { id:1, name:"Sneakers", price:79, category:"Shoes", image:"https://m.media-amazon.com/images/I/71eBPy9bgAL._UY900_.jpg" },
      { id:2, name:"Backpack", price:49, category:"Bags", image:"https://solo-ny.com/cdn/shop/files/UBN795-4_HO_887bba68-33a4-48d5-a1b6-b5947c6164ac.jpg" },
      { id:3, name:"Headphones", price:99, category:"Electronics", image:"https://m.media-amazon.com/images/I/610ub5kytVL.jpg" },
      { id:4, name:"Smartwatch", price:129, category:"Electronics", image:"https://source.unsplash.com/200x200/?smartwatch" },
      { id:5, name:"Boots", price:120, category:"Shoes", image:"https://source.unsplash.com/200x200/?boots" },
    ];
    const categories = ["All","Shoes","Bags","Electronics"];
    let cart = [];
    let selectedCategory = "All";

    const productGrid = document.getElementById("product-grid");
    const cartCount = document.getElementById("cart-count");
    const cartItems = document.getElementById("cart-items");
    const cartTotal = document.getElementById("cart-total");
    const cartDrawer = document.getElementById("cart-drawer");
    const backdrop = document.getElementById("backdrop");
    const checkoutModal = document.getElementById("checkout-modal");
    const checkoutTotal = document.getElementById("checkout-total");
    const searchInput = document.getElementById("search");
    const categoriesDiv = document.getElementById("categories");

    // Render categories
    categories.forEach(cat => {
      const btn = document.createElement("button");
      btn.textContent = cat;
      btn.className = `px-3 py-1 rounded-full border font-medium ${cat==="All"?"bg-blue-600 text-white border-blue-600":"bg-white text-gray-700 border-gray-300 hover:bg-gray-100"} transition`;
      btn.onclick = () => {
        selectedCategory = cat;
        document.querySelectorAll("#categories button").forEach(b=>b.classList.remove("bg-blue-600","text-white","border-blue-600"));
        btn.classList.add("bg-blue-600","text-white","border-blue-600");
        renderProducts();
      };
      categoriesDiv.appendChild(btn);
    });

    function renderProducts() {
      productGrid.innerHTML="";
      const search = searchInput.value.toLowerCase();
      const filtered = products.filter(p=>(selectedCategory==="All"||p.category===selectedCategory)&&p.name.toLowerCase().includes(search));
      if(filtered.length===0){
        const p=document.createElement("p");
        p.textContent="No products found.";
        p.className="col-span-full text-center text-gray-500 mt-10";
        productGrid.appendChild(p);
        return;
      }
      filtered.forEach(product=>{
        const div=document.createElement("div");
        div.className="product-card bg-white rounded-2xl shadow-md p-4 flex flex-col items-center show";
        div.innerHTML=`
          <img src="${product.image}" alt="${product.name}" class="w-40 h-40 object-cover mb-3 rounded-lg">
          <h2 class="font-bold text-lg">${product.name}</h2>
          <p class="text-gray-600 mb-2">$${product.price}</p>
          <button class="mt-2 w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Add to Cart</button>
        `;
        div.querySelector("button").onclick=()=>addToCart(product);
        productGrid.appendChild(div);
        setTimeout(()=>div.classList.add("show"),50); // fade-in effect
      });
    }

    function addToCart(product){
      cart.push(product);
      updateCart();
    }

    function updateCart(){
      cartCount.textContent=cart.length;
      cartItems.innerHTML="";
      let total=0;
      cart.forEach(item=>{
        total+=item.price;
        const li=document.createElement("li");
        li.className="flex justify-between border-b pb-1";
        li.textContent=`${item.name} $${item.price}`;
        cartItems.appendChild(li);
      });
      cartTotal.textContent=`$${total}`;
      checkoutTotal.textContent=`$${total}`;
    }

    document.getElementById("cart-btn").onclick=()=>{cartDrawer.classList.add("open"); backdrop.classList.add("visible");};
    backdrop.onclick=()=>{cartDrawer.classList.remove("open"); backdrop.classList.remove("visible");};
    document.getElementById("checkout-btn").onclick=()=>checkoutModal.classList.remove("hidden");
    document.getElementById("confirm-btn").onclick=()=>{
      cart=[]; updateCart(); checkoutModal.classList.add("hidden"); cartDrawer.classList.remove("open"); backdrop.classList.remove("visible");
    };

    searchInput.addEventListener("input", renderProducts);

    renderProducts();
  </script>
</body>
</html>
